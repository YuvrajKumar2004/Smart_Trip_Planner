# ===================================
# SERVER
# ===================================
server.port=8080

# ===================================
# DATABASE
# ===================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================
# JPA / HIBERNATE
# ===================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================================
# GOOGLE OAUTH
# ===================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:test}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:test}
spring.security.oauth2.client.registration.google.scope=email,profile

# ===================================
# GITHUB OAUTH
# ===================================
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:test}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:test}
spring.security.oauth2.client.registration.github.scope=user:email,read:user

# ===================================
# JWT
# ===================================
app.jwt.secret=${JWT_SECRET:test-jwt-secret-key-minimum-32-characters}
app.jwt.expiration-ms=9000000
app.jwt.refresh-expiration-ms=604800000

# ===================================
# RAZORPAY
# ===================================
razorpay.key.id=${RAZORPAY_KEY_ID:test_key}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:test_secret}
razorpay.currency=INR